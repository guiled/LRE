[package]
name = "lre-transforms"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_core = { version = "78.*", features = ["ecma_plugin_transform"] }

[dev-dependencies]
swc_core = { version = "78.*", features = ["ecma_plugin_transform", "ecma_parser", "ecma_codegen", "ecma_transforms"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(swc_ast_unknown)'] }
